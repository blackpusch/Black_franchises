server:
  port: ${PORT:8080}

spring:
  application:
    name: franchises-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/franchises}
      auto-index-creation: true

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
