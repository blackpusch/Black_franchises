services:
  mongodb:
    image: mongo:7.0
    container_name: franchises-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=franchises
    volumes:
      - mongo_data:/data/db
    networks:
      - franchise-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  franchises-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franchises-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/franchises
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${PORT:-8080}/actuator/health/liveness\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - franchise-net

networks:
  franchise-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
